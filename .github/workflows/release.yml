name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Verify released version
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          node -e 'const fs=require("node:fs"); const pkg=JSON.parse(fs.readFileSync("package.json")); const lock=JSON.parse(fs.readFileSync("package-lock.json")); const tag=process.env.RELEASE_TAG; if (`v${pkg.version}` !== tag || lock.version !== pkg.version || lock.packages[""].version !== pkg.version) process.exit(1)'
          grep -F "## [${RELEASE_TAG#v}]" CHANGELOG.md

      - name: Open synchronization pull request
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          existing="$(gh pr list --base develop --head master --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Synchronization pull request #${existing} is already open."
          else
            gh pr create --base develop --head master --title "chore(release): sync ${RELEASE_TAG} to develop" --body "Synchronize ${RELEASE_TAG} version metadata and changelog back to the integration branch."
          fi
